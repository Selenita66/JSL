# ====================================================================
# CEOapp Enterprise Docker Compose - OCI Always Free ARM64 Optimized
# ====================================================================
version: '3.8'

networks:
  ceoapp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mariadb-data:
    driver: local
  ceoapp-uploads:
    driver: local
  ceoapp-logs:
    driver: local
  ceoapp-database:
    driver: local
  nginx-ssl:
    driver: local
  nginx-cache:
    driver: local

services:
  # 🌐 NGINX Reverse Proxy Enterprise
  nginx:
    image: nginx:1.25-alpine
    container_name: ceoapp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-ssl:/etc/letsencrypt
      - nginx-cache:/var/cache/nginx
      - ceoapp-logs:/var/log/nginx
      - /opt/ceoapp/public:/var/www/html:ro
    environment:
      - DOMAIN=${DOMAIN}
      - NGINX_WORKER_PROCESSES=${NGINX_WORKER_PROCESSES:-4}
      - NGINX_WORKER_CONNECTIONS=${NGINX_WORKER_CONNECTIONS:-2048}
    depends_on:
      - php-fpm
    networks:
      ceoapp-network:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # 🐘 PHP-FPM 8.2 Alpine ARM64 Enterprise
  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PHP_VERSION=8.2
        - BUILD_ENV=production
    container_name: ceoapp-php-fpm
    restart: unless-stopped
    volumes:
      - /opt/ceoapp:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/php.ini:ro
      - ./php/php-fpm.conf:/usr/local/etc/php-fpm.conf:ro
      - ./php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - ceoapp-uploads:/var/www/html/uploads
      - ceoapp-logs:/var/www/html/logs
      - ceoapp-database:/var/www/html/database
    environment:
      - APP_ENV=${APP_ENV}
      - DB_HOST=${DB_HOST}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME}
      - OPCACHE_ENABLED=${OPCACHE_ENABLED}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      ceoapp-network:
        ipv4_address: 172.20.0.20
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: '3.0'
        reservations:
          memory: 8G
          cpus: '2.0'

  # 🛢️ MariaDB Enterprise Optimized
  mariadb:
    image: mariadb:11.2
    container_name: ceoapp-mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./mariadb/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
      - ceoapp-logs:/var/log/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MARIADB_CHARACTER_SET_SERVER=utf8mb4
      - MARIADB_COLLATION_SERVER=utf8mb4_unicode_ci
      - MARIADB_INNODB_BUFFER_POOL_SIZE=8G
      - MARIADB_INNODB_LOG_FILE_SIZE=2G
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=8G
      --innodb-log-file-size=2G
      --innodb-flush-method=O_DIRECT
      --innodb-flush-log-at-trx-commit=2
      --query-cache-type=1
      --query-cache-size=512M
      --max-connections=500
      --thread-cache-size=50
      --table-open-cache=4000
      --sort-buffer-size=16M
      --read-buffer-size=8M
      --read-rnd-buffer-size=16M
      --myisam-sort-buffer-size=128M
      --thread-concurrency=8
      --tmp-table-size=512M
      --max-heap-table-size=512M
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=2
    networks:
      ceoapp-network:
        ipv4_address: 172.20.0.30
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 80s
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '2.0'
        reservations:
          memory: 4G
          cpus: '1.0'

  # 🚀 Redis Cache (Future Implementation)
  redis:
    image: redis:7.2-alpine
    container_name: ceoapp-redis
    restart: unless-stopped
    profiles: ["cache"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      ceoapp-network:
        ipv4_address: 172.20.0.40
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # 📊 Prometheus Monitoring (Optional)
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: ceoapp-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      ceoapp-network:
        ipv4_address: 172.20.0.50
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # 🔧 Certbot SSL Certificate Management
  certbot:
    image: certbot/certbot:latest
    container_name: ceoapp-certbot
    restart: "no"
    profiles: ["ssl"]
    volumes:
      - nginx-ssl:/etc/letsencrypt
      - /opt/ceoapp/public:/var/www/html:ro
    environment:
      - DOMAIN=${DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    command: >
      sh -c "
      if [ ! -f /etc/letsencrypt/live/${DOMAIN}/fullchain.pem ]; then
        certbot certonly --webroot --webroot-path=/var/www/html --email ${LETSENCRYPT_EMAIL} --agree-tos --no-eff-email -d ${DOMAIN}
      else
        certbot renew --quiet
      fi
      "
    depends_on:
      - nginx
    networks:
      - ceoapp-network

  # 🧹 Log Rotation Service
  logrotate:
    image: alpine:3.19
    container_name: ceoapp-logrotate
    restart: unless-stopped
    profiles: ["maintenance"]
    volumes:
      - ceoapp-logs:/var/log/ceoapp
      - ./logrotate/logrotate.conf:/etc/logrotate.conf:ro
    command: >
      sh -c "
      while true; do
        logrotate -f /etc/logrotate.conf
        sleep 86400
      done
      "
    networks:
      - ceoapp-network

  # 📦 Backup Service (Optional)
  backup:
    image: alpine:3.19
    container_name: ceoapp-backup
    restart: unless-stopped
    profiles: ["backup"]
    volumes:
      - mariadb-data:/backup/mariadb:ro
      - ceoapp-uploads:/backup/uploads:ro
      - ceoapp-database:/backup/database:ro
      - /opt/ceoapp/backups:/backups
    environment:
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS}
      - DB_HOST=${DB_HOST}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    command: >
      sh -c "
      apk add --no-cache mysql-client tar gzip
      while true; do
        DATE=\$(date +%Y%m%d_%H%M%S)
        mkdir -p /backups/\$DATE
        mysqldump -h mariadb -u ${DB_USERNAME} -p${DB_PASSWORD} ${DB_DATABASE} | gzip > /backups/\$DATE/database.sql.gz
        tar czf /backups/\$DATE/uploads.tar.gz -C /backup uploads
        tar czf /backups/\$DATE/database_files.tar.gz -C /backup database
        find /backups -type d -mtime +${BACKUP_RETENTION_DAYS} -exec rm -rf {} +
        sleep 86400
      done
      "
    depends_on:
      - mariadb
    networks:
      - ceoapp-network

  # 🔍 Health Check Service
  healthcheck:
    image: alpine:3.19
    container_name: ceoapp-healthcheck
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: >
      sh -c "
      apk add --no-cache curl docker-cli
      while true; do
        curl -f http://nginx/health || echo 'Health check failed'
        docker ps --filter 'label=com.docker.compose.project=ceoapp' --format 'table {{.Names}}\t{{.Status}}'
        sleep 300
      done
      "
    networks:
      - ceoapp-network