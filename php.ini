# ====================================================================
# CEOapp Enterprise PHP Configuration - OCI Always Free ARM64 Optimized
# PHP 8.2 FPM - 24GB RAM, 4 vCPUs ARM64 - Enterprise Security Level
# ====================================================================

[PHP]
; 🚀 CORE PERFORMANCE SETTINGS
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
unserialize_callback_func =
serialize_precision = -1
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source
disable_classes =
zend.enable_gc = On
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0

; 🧠 MEMORY MANAGEMENT (Optimized for 24GB RAM)
memory_limit = 2G
max_execution_time = 300
max_input_time = 300
max_input_vars = 10000
max_input_nesting_level = 64
memory_get_usage = On

; 📁 FILE UPLOADS (Enterprise Level)
file_uploads = On
upload_tmp_dir = /tmp/php-uploads
upload_max_filesize = 100M
max_file_uploads = 50
post_max_size = 100M

; 🔐 SECURITY ENTERPRISE CONFIGURATION
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off
auto_globals_jit = On
register_argc_argv = Off
auto_prepend_file =
auto_append_file =
default_mimetype = "text/html"
default_charset = "UTF-8"
internal_encoding = UTF-8
input_encoding = UTF-8
output_encoding = UTF-8

; 🚨 ERROR HANDLING & LOGGING
log_errors = On
log_errors_max_len = 1024
ignore_repeated_errors = Off
ignore_repeated_source = Off
report_memleaks = On
display_errors = Off
display_startup_errors = Off
error_reporting = E_ERROR & ~E_DEPRECATED & ~E_STRICT
error_log = /var/log/php/error.log
syslog.ident = ceoapp-php

; 📊 RESOURCE LIMITS (ARM64 Optimized)
default_socket_timeout = 60
user_ini.filename = ".user.ini"
user_ini.cache_ttl = 300
realpath_cache_size = 4096K
realpath_cache_ttl = 120

; 🌐 HTTP & SESSIONS
variables_order = "GPCS"
request_order = "GP"
register_globals = Off
register_long_arrays = Off
register_argc_argv = Off
auto_globals_jit = On
post_max_size = 100M
auto_prepend_file =
auto_append_file =
default_mimetype = "text/html"
default_charset = "UTF-8"

; 🔒 SESSION SECURITY (Enterprise Level)
session.save_handler = files
session.save_path = "/tmp/php-sessions"
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.name = CEOAPP_SESSID
session.auto_start = 0
session.cookie_lifetime = 3600
session.cookie_path = /
session.cookie_domain =
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
session.serialize_handler = php_serialize
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 3600
session.referer_check =
session.cache_limiter = nocache
session.cache_expire = 180
session.use_trans_sid = 0
session.sid_length = 48
session.trans_sid_tags = "a=href,area=href,frame=src,form="
session.sid_bits_per_character = 6

; 🚀 OPCACHE CONFIGURATION (Optimized for 24GB RAM)
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 20000
opcache.max_wasted_percentage = 5
opcache.use_cwd = 1
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.revalidate_path = 0
opcache.save_comments = 0
opcache.enable_file_override = 0
opcache.optimization_level = 0x7FFFBFFF
opcache.dups_fix = 0
opcache.blacklist_filename = /usr/local/etc/php/opcache-blacklist.txt
opcache.max_file_size = 0
opcache.consistency_checks = 0
opcache.force_restart_timeout = 180
opcache.error_log = /var/log/php/opcache.log
opcache.log_verbosity_level = 1
opcache.record_warnings = 1
opcache.preferred_memory_model =
opcache.protect_memory = 0
opcache.mmap_base =
opcache.restrict_api =
opcache.file_update_protection = 2
opcache.huge_code_pages = 1
opcache.lockfile_path = /tmp
opcache.opt_debug_level = 0
opcache.file_cache = /tmp/opcache
opcache.file_cache_only = 0
opcache.file_cache_consistency_checks = 1
opcache.file_cache_fallback = 1
opcache.validate_permission = 0
opcache.validate_root = 0
opcache.preload_user = ceoapp
opcache.cache_id =

; 📦 APCU CACHE
[apcu]
apc.enabled = 1
apc.shm_size = 256M
apc.ttl = 7200
apc.user_ttl = 7200
apc.gc_ttl = 3600
apc.cache_by_default = 1
apc.filters =
apc.mmap_file_mask = /tmp/apc.XXXXXX
apc.slam_defense = 1
apc.file_update_protection = 2
apc.enable_cli = 0
apc.max_file_size = 5M
apc.use_request_time = 1
apc.serializer = php
apc.coredump_unmap = 0
apc.preload_path =

; 🗄️ DATABASE EXTENSIONS
[mysqli]
mysqli.max_persistent = -1
mysqli.allow_persistent = On
mysqli.max_links = -1
mysqli.cache_size = 2000
mysqli.default_port = 3306
mysqli.default_socket =
mysqli.default_host =
mysqli.default_user =
mysqli.default_pw =
mysqli.reconnect = Off

[mysqlnd]
mysqlnd.collect_statistics = On
mysqlnd.collect_memory_statistics = On

[PDO]
pdo_mysql.cache_size = 2000
pdo_mysql.default_socket =

[PDO_SQLITE]
pdo_sqlite.cache_size = 8192

; 🖼️ IMAGE PROCESSING
[gd]
gd.jpeg_ignore_warning = 1

[exif]
exif.encode_unicode = ISO-8859-15
exif.decode_unicode_motorola = UCS-2BE
exif.decode_unicode_intel = UCS-2LE
exif.encode_jis =
exif.decode_jis_motorola = JIS
exif.decode_jis_intel = JIS

; 📧 MAIL
[mail function]
SMTP = localhost
smtp_port = 25
mail.add_x_header = Off
mail.mixed_lf_and_crlf = Off

; 🌍 INTERNATIONALIZATION
[intl]
intl.default_locale =
intl.error_level = E_WARNING
intl.use_exceptions = 0

; 📝 MBSTRING
[mbstring]
mbstring.language = English
mbstring.internal_encoding = UTF-8
mbstring.http_input = auto
mbstring.http_output = UTF-8
mbstring.encoding_translation = Off
mbstring.detect_order = auto
mbstring.substitute_character = none
mbstring.func_overload = 0
mbstring.strict_detection = On
mbstring.http_output_conv_mimetypes = "^(text/|application/xhtml\+xml)"

; 🔐 OPENSSL
[openssl]
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
openssl.capath = /etc/ssl/certs

; 🕒 DATE & TIME
[Date]
date.timezone = UTC
date.default_latitude = 31.7667
date.default_longitude = 35.2333
date.sunrise_zenith = 90.583333
date.sunset_zenith = 90.583333

; 🔄 CURL
[curl]
curl.cainfo = /etc/ssl/certs/ca-certificates.crt

; 📦 FILTER
[filter]
filter.default = unsafe_raw
filter.default_flags =

; 🧮 BCMATH
[bcmath]
bcmath.scale = 0

; 🔗 SOAP
[soap]
soap.wsdl_cache_enabled = 1
soap.wsdl_cache_dir = "/tmp"
soap.wsdl_cache_ttl = 86400
soap.wsdl_cache_limit = 5

; 🗜️ ZLIB
[zlib]
zlib.output_compression = Off
zlib.output_compression_level = -1
zlib.output_handler =

; 📋 ASSERTIONS
[Assertion]
zend.assertions = -1
assert.active = Off
assert.exception = On
assert.warning = On
assert.bail = Off
assert.callback = 0

; 🔧 TIDY (if available)
[tidy]
tidy.clean_output = Off

; 🎯 XDEBUG (Development Only)
[xdebug]
xdebug.mode = off
xdebug.start_with_request = no
xdebug.client_port = 9003
xdebug.client_host = host.docker.internal
xdebug.idekey = CEOAPP_XDEBUG
xdebug.log = /var/log/php/xdebug.log
xdebug.log_level = 7
xdebug.max_nesting_level = 512
xdebug.var_display_max_children = 256
xdebug.var_display_max_data = 1024
xdebug.var_display_max_depth = 5

; 🚀 REDIS (Cache Extension)
[redis]
redis.arrays.names = ''
redis.arrays.hosts = ''
redis.arrays.previous = ''
redis.arrays.functions = ''
redis.arrays.index = ''
redis.arrays.autorehash = 0
redis.arrays.retryinterval = 0
redis.arrays.lazyconnect = 0
redis.arrays.connecttimeout = 0
redis.arrays.readtimeout = 0
redis.arrays.algorithm = ''
redis.arrays.consistent = 0
redis.arrays.distributor = ''
redis.clusters.seeds = ''
redis.clusters.timeout = 0
redis.clusters.read_timeout = 0
redis.clusters.auth = ''
redis.sessions.locking_enabled = 0
redis.sessions.lock_expire = 0
redis.sessions.lock_wait_time = 2000
redis.sessions.lock_retries = 10
redis.pconnect.pooling_enabled = 1
redis.pconnect.connection_limit = 0
redis.pconnect.echo_check_liveness = 1
redis.pconnect.pool_pattern = ''
redis.pconnect.pool_detect_dirty = 0

; 🧠 MEMCACHED (if enabled)
[memcached]
memcached.sess_locking = On
memcached.sess_consistent_hash = On
memcached.sess_binary = Off
memcached.sess_lock_wait_min = 1000
memcached.sess_lock_wait_max = 2000
memcached.sess_lock_retries = 5
memcached.sess_lock_expire = 0
memcached.sess_prefix = "ceoapp.sess.key."
memcached.sess_number_of_replicas = 0
memcached.sess_randomize_replica_read = Off
memcached.sess_remove_failed = On
memcached.sess_connect_timeout = 1000
memcached.compression_type = "fastlz"
memcached.compression_factor = 1.3
memcached.compression_threshold = 2000
memcached.serializer = "php"
memcached.store_retry_count = 2

; 🏗️ ENTERPRISE CUSTOM SETTINGS
[ceoapp]
; Custom CEOapp enterprise configurations
ceoapp.environment = production
ceoapp.debug_mode = off
ceoapp.security_level = enterprise
ceoapp.performance_mode = optimized
ceoapp.arm64_optimizations = on